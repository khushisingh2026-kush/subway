<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3-Lane Endless Runner</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #1a1a2e;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    canvas {
      border: 3px solid #e94560;
      background-color: #16213e;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  // --- 1. GAME CONFIGURATION & STATE ---
  const LANES = [80, 200, 320]; // X-coordinates for Left, Center, Right lanes
  let gameState = "PLAYING"; // "PLAYING" or "GAMEOVER"
  let score = 0;
  let coinsCollected = 0;
  let gameSpeed = 5;
  let frameCount = 0;

  // --- 2. PLAYER OBJECT & PHYSICS ---
  const player = {
    lane: 1, // Start in center lane (index 1)
    x: LANES[1],
    y: 480,
    width: 40,
    height: 60,
    normalHeight: 60,
    slideHeight: 30,
    velocityY: 0,
    gravity: 0.8,
    jumpPower: -15,
    isJumping: false,
    isSliding: false,
    slideTimer: 0
  };

  let obstacles = [];
  let coins = [];

  // --- 3. INPUT HANDLING (KEYBOARD & SWIPE) ---
  document.addEventListener("keydown", (e) => {
    if (gameState === "GAMEOVER" && e.code === "Space") {
      resetGame();
      return;
    }
    if (gameState !== "PLAYING") return;

    if (e.key === "ArrowLeft" || e.key === "a") moveLeft();
    if (e.key === "ArrowRight" || e.key === "d") moveRight();
    if (e.key === "ArrowUp" || e.key === "w" || e.code === "Space") jump();
    if (e.key === "ArrowDown" || e.key === "s") slide();
  });

  // --- 4. PLAYER MOVEMENT FUNCTIONS ---
  function moveLeft() {
    if (player.lane > 0) player.lane--;
  }

  function moveRight() {
    if (player.lane < 2) player.lane++;
  }

  function jump() {
    if (!player.isJumping) {
      player.isJumping = true;
      player.isSliding = false;
      player.height = player.normalHeight;
      player.velocityY = player.jumpPower;
    }
  }

  function slide() {
    if (!player.isSliding) {
      player.isSliding = true;
      player.slideTimer = 35; // Frames to stay sliding
      player.height = player.slideHeight;
      // Fast-fall if currently mid-air
      if (player.isJumping) {
        player.velocityY = 12;
      }
    }
  }

  // --- 5. SPAWNING LOGIC ---
  function spawnEntities() {
    // Spawn an obstacle every 75 frames (scales with speed)
    const spawnRate = Math.max(35, Math.floor(80 - gameSpeed * 2));
    if (frameCount % spawnRate === 0) {
      const randomLane = Math.floor(Math.random() * 3);
      const types = ["BARRIER_LOW", "BARRIER_HIGH", "TRAIN"];
      const type = types[Math.floor(Math.random() * types.length)];

      let obsHeight = 40;
      let obsYOffset = 0;

      if (type === "BARRIER_HIGH") {
        obsHeight = 45;
        obsYOffset = -35; // Elevated barrier (must slide under)
      } else if (type === "TRAIN") {
        obsHeight = 110; // Tall obstacle (must switch lanes)
      }

      obstacles.push({
        x: LANES[randomLane],
        y: -120 + obsYOffset,
        width: 45,
        height: obsHeight,
        type: type
      });

      // Spawn a coin in a different lane
      const coinLane = (randomLane + 1) % 3;
      coins.push({
        x: LANES[coinLane],
        y: -100,
        radius: 12
      });
    }
  }

  // --- 6. UPDATE & PHYSICS LOOP ---
  function update() {
    if (gameState !== "PLAYING") return;

    frameCount++;
    score += 0.1;

    // Gradually increase difficulty
    if (frameCount % 300 === 0) {
      gameSpeed += 0.4;
    }

    // Smooth horizontal lane interpolation
    const targetX = LANES[player.lane];
    player.x += (targetX - player.x) * 0.25;

    // Vertical jump & gravity physics
    const groundY = 540 - player.height;
    if (player.isJumping) {
      player.y += player.velocityY;
      player.velocityY += player.gravity;

      if (player.y >= groundY) {
        player.y = groundY;
        player.isJumping = false;
        player.velocityY = 0;
      }
    } else {
      player.y = groundY;
    }

    // Slide duration timer
    if (player.isSliding) {
      player.slideTimer--;
      if (player.slideTimer <= 0) {
        player.isSliding = false;
        player.height = player.normalHeight;
      }
    }

    spawnEntities();

    // Update & check Obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      let obs = obstacles[i];
      obs.y += gameSpeed;

      if (checkCollision(player, obs)) {
        gameState = "GAMEOVER";
      }

      if (obs.y > canvas.height + 100) {
        obstacles.splice(i, 1);
      }
    }

    // Update & check Coins
    for (let i = coins.length - 1; i >= 0; i--) {
      let coin = coins[i];
      coin.y += gameSpeed;

      const coinBox = {
        x: coin.x,
        y: coin.y,
        width: coin.radius * 2,
        height: coin.radius * 2
      };

      if (checkCollision(player, coinBox)) {
        coinsCollected++;
        score += 10;
        coins.splice(i, 1);
        continue;
      }

      if (coin.y > canvas.height + 50) {
        coins.splice(i, 1);
      }
    }
  }

  // --- 7. COLLISION DETECTION (AABB) ---
  function checkCollision(rect1, rect2) {
    // Center-aligned X coordinates
    const r1Left = rect1.x - rect1.width / 2;
    const r1Right = rect1.x + rect1.width / 2;
    const r1Top = rect1.y;
    const r1Bottom = rect1.y + rect1.height;

    const r2Left = rect2.x - rect2.width / 2;
    const r2Right = rect2.x + rect2.width / 2;
    const r2Top = rect2.y;
    const r2Bottom = rect2.y + rect2.height;

    return (
      r1Left < r2Right &&
      r1Right > r2Left &&
      r1Top < r2Bottom &&
      r1Bottom > r2Top
    );
  }

  // --- 8. RENDERING ENGINE ---
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw 3 Track Lanes
    ctx.strokeStyle = "#0f3460";
    ctx.lineWidth = 4;
    LANES.forEach((laneX) => {
      ctx.beginPath();
      ctx.moveTo(laneX, 0);
      ctx.lineTo(laneX, canvas.height);
      ctx.stroke();
    });

    // Draw Coins
    ctx.fillStyle = "#ffd700";
    coins.forEach((coin) => {
      ctx.beginPath();
      ctx.arc(coin.x, coin.y + coin.radius, coin.radius, 0, Math.PI * 2);
      ctx.fill();
    });

    // Draw Obstacles
    obstacles.forEach((obs) => {
      if (obs.type === "TRAIN") ctx.fillStyle = "#e94560";
      else if (obs.type === "BARRIER_HIGH") ctx.fillStyle = "#f39c12";
      else ctx.fillStyle = "#ff6b6b";

      ctx.fillRect(obs.x - obs.width / 2, obs.y, obs.width
